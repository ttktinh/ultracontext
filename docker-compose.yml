version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ultracontext
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ultracontext_change_me}
      POSTGRES_DB: ultracontext
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount schema để auto-init (hoặc chạy migrate thủ công sau)
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultracontext -d ultracontext"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - dokploy-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://ultracontext:${POSTGRES_PASSWORD:-ultracontext_change_me}@postgres:5432/ultracontext
      ULTRACONTEXT_ADMIN_KEY: ${ULTRACONTEXT_ADMIN_KEY}
      PORT: 8787
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8787"
    networks:
      - dokploy-network

volumes:
  postgres_data:

networks:
  dokploy-network:
    external: true
